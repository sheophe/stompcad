[project]
name = "stompcollider"
version = "0.1.0"
description = "Seats PCB models inside a drilled case and reports where they clash"
requires-python = ">=3.10"
# stompmodel alone. This phase's core is kernel-free by design -- the
# geometry-touching sources and emitters that will need stompgeom and the
# kernel are a later task's addition, not this one's.
dependencies = ["stompmodel"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: without this marker a downstream type checker discards every
# annotation this distribution ships.
[tool.setuptools.package-data]
stompcollider = ["py.typed"]

[tool.uv.sources]
stompmodel = { workspace = true }

# So ADR-0008's sentence -- change into the member, sync, test -- runs a real
# suite rather than an import check. `mypy` is here because the root gate
# excludes this member's tests: three (now four) `tests` packages cannot
# share one scan. `hypothesis` covers the property tests later tasks add.
[dependency-groups]
dev = ["pytest", "mypy", "hypothesis"]

# `pythonpath` reaches the repo root, mirroring the other members: the
# ownership gates read `tools.workspace_membership` for the one statement of
# which packages to scan -- a text read across siblings, never an import of
# one.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["../.."]

# `mypy_path` gains the repo root for the same reason `pythonpath` does above:
# the ownership gates import `tools.workspace_membership`.
[tool.mypy]
python_version = "3.10"
mypy_path = ["src", "../.."]
files = ["src", "tests"]

# mutmut resolves tests through the pyproject.toml in the current working
# directory, and the root one names only stompdrill's testpaths, so a mutant of
# this member run through the root config would record a false survivor.
# `cd packages/stompcollider && mutmut run` is the real survey.
[tool.mutmut]
source_paths = ["src/stompcollider"]
# mutmut injects `import mutmut` into every module it instruments, which the
# boundary gate rejects by design. Deselecting keeps the gate's assertion
# exact rather than weakening the rule itself.
pytest_add_cli_args_test_selection = [
    "--deselect=tests/test_package_boundary.py::test_every_module_imports_only_the_standard_library_and_itself",
]
