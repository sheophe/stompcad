[project]
name = "stompdrill"
version = "0.1.0"
description = "Extract drill data from Adobe Illustrator artwork and emit it in fabrication formats"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Paul Vakhnivskyi", email = "pvakhnivskyi@gmail.com" }]
keywords = ["cad", "cnc", "excellon", "drilling", "illustrator", "guitar-pedal", "enclosure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["stompmodel", "stompgeom", "pikepdf>=9"]

[project.urls]
Homepage = "https://github.com/sheophe/stompcad"
Repository = "https://github.com/sheophe/stompcad"
Issues = "https://github.com/sheophe/stompcad/issues"

[project.scripts]
stompdrill = "stompdrill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: without this marker a downstream type checker treats the whole
# distribution as untyped and discards every annotation.
[tool.setuptools.package-data]
stompdrill = ["py.typed"]

[tool.uv.sources]
stompmodel = { workspace = true }
stompgeom = { workspace = true }

# What this package's own suite needs, so that ADR-0008's sentence -- change
# into the member, sync, test -- runs a real suite rather than an import check.
# `pdfminer.six` joins `pytest` for one reason: tests/recovery/pdf.py reads a
# drawing back independently of the writer, and the writer's own transforms
# are the thing it exists to check. `hypothesis` joins them for the generative
# properties in test_invariant.py, test_snap.py and test_pipeline.py, whose
# answer sets have boundaries an author would not think to write down by hand.
# The geometry kernel itself is not listed here: it arrives transitively
# through `stompgeom`'s own unconditional dependency, not as a dev extra.
[dependency-groups]
dev = ["pytest", "pdfminer.six", "hypothesis"]

# Its own testpaths, so `cd packages/stompdrill && pytest` is correct and does
# not inherit a root testpaths pointing at a sibling package. `pythonpath`
# reaches the repo root, because test_enclosures.py re-derives the catalogue
# through tools/build_catalogue.py and tools/ stays at the root; pytest
# resolves it against this file's directory, so it holds from either cwd.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["hammond: needs a real Hammond STEP model; run with --hammond"]
pythonpath = ["../.."]

# Run from this directory: `cd packages/stompdrill && mutmut run`. src/stompdrill
# then maps to mutants/src, which is one of the three paths mutmut imports from.
[tool.mutmut]
source_paths = ["src/stompdrill"]
also_copy = ["tests/fixtures/"]
# enclosures.py is generated, and test_enclosures.py asserts that its *text on
# disk* is what tools/build_catalogue.py renders. Instrumenting it fails that
# test for every mutant, which aborts the whole run before any result is
# collected. Excluding it costs nothing: it is a literal catalogue table, so a
# mutant of it is either caught by the first assertion or meaningless.
do_not_mutate = ["src/stompdrill/enclosures.py"]
# Three tests read source text or a path outside the copied tree rather than
# behaviour, so mutmut's rewritten files fail them for every mutant and abort
# the survey before any result is collected. test_enclosures.py re-reads
# docs/parts/dimensions.tsv; the CLI test ast.parses cli.py, whose mutated
# form contains every mutant literal; the routing performance test asserts a
# wall-clock bound, and under mutmut (and especially under --cov, which
# inflates pure-Python time several-fold) a timeout scores as a killed mutant
# regardless of the mutation's actual effect. None of the three costs real
# coverage: each targets something no other test in the suite checks, and
# `--tb=short` runs still exercise all three on every commit.
pytest_add_cli_args_test_selection = [
    "--deselect=tests/test_enclosures.py",
    "--deselect=tests/test_cli.py::test_cli_source_never_names_a_registered_format",
    "--deselect=tests/test_route.py::test_a_realistic_panel_routes_without_the_cubic_term",
]
# mutmut runs the test command from inside mutants/, one directory deeper than
# this file's own location, so the "../.." above (correct for a plain `pytest`
# invocation, which runs from this directory) resolves one level short of the
# repository root and tests/conftest.py's `from tools.fetch_case_model import
# ...` -- needed only to register the hammond fixtures, not to run them --
# fails for every test, not only the ones marked hammond. `-o` overrides the
# ini value for this run alone, so the plain-pytest path above is untouched.
pytest_add_cli_args = ["-o", "pythonpath=../../.."]
