[project]
name = "aidrill"
version = "0.1.0"
description = "Extract drill data from Adobe Illustrator artwork and emit it in fabrication formats"
requires-python = ">=3.10"
dependencies = ["pikepdf>=9"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "mutmut"]
step = ["cadquery-ocp==7.9.3.1.1"]

[project.scripts]
aidrill = "aidrill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# A gate that has never been green is not a gate, it is where a real finding
# hides. Both tools below are configured to be clean, so a new error means a
# new defect. Neither is pinned to a version-inferred default: an unconfigured
# ruff grades against whatever the installed release happens to default to, and
# an unconfigured mypy infers python_version from the interpreter that invoked
# it rather than from requires-python.
[tool.ruff]
target-version = "py310"
# E501 is not selected — no line-length convention is declared in prose and 206
# existing lines exceed ruff's default 88. But I001 wraps an import block at
# whatever line-length is in force, so leaving it unset let the undeclared 88
# reformat two import statements that were never over-long by this codebase's
# own measure. 110 is what the tree already observes: its longest line is 109.
line-length = 110

[tool.ruff.lint]
# Individual codes on top of ruff's own defaults (E4, E7, E9, F), never whole
# families. A family drags in rules this repo has deliberately not adopted:
# E501 fires on long imports where no line-length convention is declared
# anywhere, and RUF001/RUF002 fire on the × — ⌀ · that CLAUDE.md's prose
# convention uses throughout.
select = [
    "E4", "E7", "E9", "F",
    "I001",
    "UP007", "UP035", "UP037",
    "B008", "B017", "B018",
    "ISC004",
    "PYI041",
    "PLC0206",
    "FURB105",
    "RUF007",
]

# RUF022 (`__all__` sorted) and RUF023 (`__slots__` sorted) are deliberately
# never selected: CLAUDE.md requires `__all__` "ordered logically rather than
# alphabetically", and `_PathBuilder.__slots__` is ordered by lifecycle role
# for the same reason. Selecting them would grade 16 deliberate orderings as
# errors, which is how a gate stops being read.

[tool.ruff.lint.per-file-ignores]
# The package root imports its subpackages in the order the flow runs — data,
# roles, source, stages, then what interprets the answer — so that the import
# block and the `__all__` beneath it read as one list. Its docstring says so.
# I001 would sort it alphabetically and decouple the two, which is the same
# objection that keeps RUF022 unselected; only here it is one file, not a rule.
"src/aidrill/__init__.py" = ["I001"]

[tool.ruff.lint.flake8-bugbear]
# Both are frozen(slots=True) value objects, so the mutable-default hazard B008
# exists to catch cannot arise: the instance built once at definition time can
# never be mutated by a caller. ``RawOutline`` earns its place beside
# ``ReferenceOutline`` because a test helper standing in for a source has to
# default to the measurement a source would have made.
#
# The unit brands are listed for a different reason: a ``NewType`` is an
# identity function returning its own argument, so a branded default is the
# literal it wraps and has no state to share. Both the bare and qualified
# spellings appear because the brands are imported by name.
extend-immutable-calls = [
    "aidrill.model.ReferenceOutline",
    "aidrill.model.RawOutline",
    "aidrill.units.Nanometre",
    "aidrill.units.Micron",
    "aidrill.units.Millimetre",
    "Nanometre",
    "Micron",
    "Millimetre",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/aidrill", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# Not `strict`. Measured at 18 further errors, almost all no-untyped-def on
# internal helpers in ai_pdf.py and model.py's alternate constructors; adopting
# it in one step would mean a gate that is red on arrival. docs/BACKLOG.md
# carries it as scoped follow-up work.

[[tool.mypy.overrides]]
# cadquery-ocp is a compiled extension with no py.typed marker, so every OCP
# symbol is Any to mypy. Narrow to OCP alone: the point of the gate is aidrill's
# own types, and a blanket ignore_missing_imports would hide a genuine missing
# dependency anywhere else.
module = ["OCP.*"]
ignore_missing_imports = true

# `mutmut run` copies the tree into mutants/ and rewrites the sources there, so
# anything the suite opens by relative path has to be copied alongside them.
# tests/ and pyproject.toml come across by default; these two do not, and
# test_enclosures.py re-derives the catalogue from docs/parts/dimensions.tsv
# through tools/build_catalogue.py on every run. A file whose parent directory
# does not exist under mutants/ fails the copy outright, which is why these name
# directories.
[tool.mutmut]
source_paths = ["src/aidrill"]
also_copy = ["docs/", "tools/", "tests/fixtures/"]
# enclosures.py is generated, and test_enclosures.py asserts that its *text on
# disk* is what tools/build_catalogue.py renders. Instrumenting it therefore fails
# that test for every mutant, which aborts the whole run before any result is
# collected. Excluding it costs nothing: it is a literal catalogue table, so a
# mutant of it is either caught by the first assertion or meaningless.
do_not_mutate = ["src/aidrill/enclosures.py"]

[tool.uv]
# cadquery-ocp pulls numpy in transitively (via vtk/matplotlib) with no version
# declared by aidrill itself, so uv resolves whatever numpy release supports the
# interpreter running the install. Numpy >=2.3 declares Requires-Python >=3.11 and
# its bundled stub uses PEP 695 `type` statements unconditionally, which mypy
# rejects against this project's python_version = "3.10" target — a tooling
# mismatch, not a real incompatibility, since aidrill never imports numpy itself.
# Capping below that keeps `mypy src/aidrill tests` clean on any interpreter this
# project supports without touching python_version or the step extra's contents.
constraint-dependencies = ["numpy<2.3"]
